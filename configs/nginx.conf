# Edge reverse proxy: the single public entry point.
#   /ws/    -> gateway nodes (WebSocket, load balanced)
#   /health -> gateway nodes
#   /       -> frontend (static React build)
events {
    worker_connections 10240;
}

http {
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    upstream chatscale {
        server gateway-1:8080;
        server gateway-2:8080;
        server gateway-3:8080;
    }

    upstream frontend {
        server frontend:80;
    }

    server {
        listen 80;

        location /ws/ {
            proxy_pass http://chatscale;
            # A stopped container's IP never answers; fail fast (default is 60s)
            # so clients see the close and back off instead of hanging.
            proxy_connect_timeout 2s;
            proxy_next_upstream_timeout 3s;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }

        location /health {
            proxy_pass http://chatscale;
        }

        location / {
            proxy_pass http://frontend;
            proxy_set_header Host $host;
        }
    }
}
