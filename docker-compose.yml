x-gateway: &gateway
  build: .
  image: chatscale-gateway
  environment: &gateway-env
    PORT: "8080"
    REDIS_ADDR: redis:6379
  depends_on:
    redis:
      condition: service_healthy
  healthcheck:
    test: ["CMD", "wget", "-qO-", "http://localhost:8080/health"]
    interval: 5s
    timeout: 2s
    retries: 3

services:
  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 2s
      retries: 5

  gateway-1:
    <<: *gateway
    environment:
      <<: *gateway-env
      NODE_ID: node-1
    ports:
      - "8081:8080"

  gateway-2:
    <<: *gateway
    environment:
      <<: *gateway-env
      NODE_ID: node-2
    ports:
      - "8082:8080"

  gateway-3:
    <<: *gateway
    environment:
      <<: *gateway-env
      NODE_ID: node-3
    ports:
      - "8083:8080"

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./configs/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - gateway-1
      - gateway-2
      - gateway-3
